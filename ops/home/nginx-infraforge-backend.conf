# InfraForge backend behind the shared Cloudflare Tunnel gateway (TLS ends at Cloudflare).
# Derived from ops/nginx.conf.template; only the listener and real-IP handling differ.
# Compose API/WS ports stay loopback-bound (3000, 3001).
limit_req_zone $binary_remote_addr zone=infraforge_health:1m rate=2r/s;
server {
    listen 127.0.0.1:8080;
    server_name infraforge-backend.lapwork.in;
    # Auth links carry bearer tokens in paths/queries. Do not inherit request logs.
    access_log off;
    error_log /dev/null;
    # Only the local tunnel connects here; use the visitor address Cloudflare reports.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    add_header Strict-Transport-Security "max-age=31536000" always;
    set $maintenance false;
    if (-f /var/lib/infraforge/releases/maintenance) { set $maintenance true; }
    add_header X-InfraForge-Maintenance $maintenance always;
    client_max_body_size 1m;

    location /api/ {
        if ($maintenance = true) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host infraforge-backend.lapwork.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host infraforge-backend.lapwork.in;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location = /ws {
        if ($maintenance = true) { return 503; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host infraforge-backend.lapwork.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host infraforge-backend.lapwork.in;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_read_timeout 75s;
    }
    location = /health/ready {
        limit_req zone=infraforge_health burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host infraforge-backend.lapwork.in;
    }
    location / { return 404; }
}
