# Shared gateway for the Cloudflare Tunnel (asus-backend -> http://127.0.0.1:8080).
# Each project adds its own file in sites-available with
#   listen 127.0.0.1:8080; server_name <its hostname>;
# Requests for any hostname no project claims end here.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 404;
}
