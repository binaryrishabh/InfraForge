name: infraforge-dev
services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: infraforge-dev-postgres
    labels:
      infraforge.project: binaryrishabh/InfraForge
      infraforge.purpose: development
    environment:
      POSTGRES_USER: infraforge
      POSTGRES_DB: infraforge_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run bun run dev:setup}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [development]
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    container_name: infraforge-dev-redis
    labels:
      infraforge.project: binaryrishabh/InfraForge
      infraforge.purpose: development
    ports: ["127.0.0.1:56379:6379"]
    networks: [development]
    tmpfs: [/data]
volumes:
  postgres_data:
    name: infraforge-dev-postgres-data
    labels:
      infraforge.project: binaryrishabh/InfraForge
      infraforge.purpose: development
networks:
  development:
    name: infraforge-dev-network
    labels:
      infraforge.project: binaryrishabh/InfraForge
      infraforge.purpose: development
