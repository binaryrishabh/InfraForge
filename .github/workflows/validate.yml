name: Validate workspaces

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - build --filter=@infraforge/web
          - typecheck
          - lint
          - test
          - check:boundaries
          - test:tooling
          - check:challenges
          - audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Each command has its own job so an existing lint/type failure cannot hide other results.
      - run: bun run ${{ matrix.command }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: infraforge_it_0123abcd
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_RUN: "1"
      INTEGRATION_DISPOSABLE: local-only
      INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/infraforge_it_0123abcd
      INTEGRATION_REDIS_PORT: "56379"
      INTEGRATION_API_PORT: "3100"
      MODEL2_BROWSER_MODULE: /tmp/infraforge-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Browser tooling is test-only; keep the application lockfile/runtime unchanged.
      - run: npm install --prefix /tmp/infraforge-browser --no-save --package-lock=false playwright@1.64.1
      - run: node /tmp/infraforge-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run test:integration
      - run: bun --no-env-file scripts/verify-internal-model2-proof.ts /tmp/infraforge-model2-*.json
      - run: bun --no-env-file scripts/verify-model2-workspace-proof.ts /tmp/infraforge-m2l/browser-proof.json
      - run: bun --no-env-file scripts/verify-model2-workspace-proof.ts docs/reality/m2l-browser-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-model2-product-proof
          path: /tmp/infraforge-model2-*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-model2-browser-proof
          path: /tmp/infraforge-m2l/
          if-no-files-found: error
          retention-days: 14

  m2m-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: infraforge_it_4567abcd
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      M2M_RUN: "1"
      INTEGRATION_DISPOSABLE: local-only
      INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/infraforge_it_4567abcd
      INTEGRATION_REDIS_PORT: "56379"
      INTEGRATION_API_PORT: "3100"
      MODEL2_BROWSER_MODULE: /tmp/infraforge-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        working-directory: apps/backend
      - run: docker build --build-arg RELEASE_SHA="${{ inputs.ref || github.sha }}" -f apps/backend/Dockerfile -t infraforge-m2m-proof .
      - run: echo "MODEL2_LESSON_IMAGE=$(docker image inspect infraforge-m2m-proof --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: npm install --prefix /tmp/infraforge-browser --no-save --package-lock=false playwright@1.64.1
      - run: node /tmp/infraforge-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: bun --no-env-file --no-install test tests/integration/lesson.integration.test.ts
        working-directory: apps/backend
      - run: bun --no-env-file scripts/verify-model2-lesson-proof.ts /tmp/infraforge-m2m/preview-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-model2-lesson-proof
          path: /tmp/infraforge-m2m/
          if-no-files-found: error
          retention-days: 14

  packaging:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      BETTER_AUTH_SECRET: packaging-only-fixture-secret-at-least-32-characters
      BETTER_AUTH_URL: https://api.example.invalid
      APP_ORIGINS: https://app.example.invalid
      WORKER_DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      MIGRATION_DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      WORKER_DATABASE_MODE: direct
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      RELEASE_IMAGE: infraforge-packaging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker compose --env-file /dev/null -f apps/backend/docker-compose.yml config --quiet
      - run: docker build --build-arg RELEASE_SHA="$RELEASE_SHA" -f apps/backend/Dockerfile -t infraforge-packaging .
      - run: |
          docker compose --env-file /dev/null -f apps/backend/docker-compose.yml config --format json > /tmp/compose.json
          for service in api worker ws-server; do
            workdir=$(jq -er --arg service "$service" '.services[$service].working_dir' /tmp/compose.json)
            entrypoint=$(jq -er --arg service "$service" '.services[$service].command[2]' /tmp/compose.json)
            docker run --rm --workdir "$workdir" infraforge-packaging bun build "$entrypoint" --target=bun --outdir=/tmp/entrypoints
          done
          docker run --rm --workdir "$workdir" infraforge-packaging bun build scripts/recover-ownership.ts --target=bun --outdir=/tmp/entrypoints
          docker run --rm --workdir "$workdir" infraforge-packaging bun build cutover/cli.ts --target=bun --outdir=/tmp/entrypoints
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file --no-install scripts/release/rehearse.ts infraforge-packaging
