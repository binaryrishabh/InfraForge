name: Validate workspaces

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - build --filter=@infraforge/web
          - typecheck
          - lint
          - test
          - check:boundaries
          - test:tooling
          - audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Each command has its own job so an existing lint/type failure cannot hide other results.
      - run: bun run ${{ matrix.command }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: infraforge_it_0123abcd
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_RUN: "1"
      INTEGRATION_DISPOSABLE: local-only
      INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/infraforge_it_0123abcd
      INTEGRATION_REDIS_PORT: "56379"
      INTEGRATION_API_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  packaging:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      BETTER_AUTH_SECRET: packaging-only-fixture-secret-at-least-32-characters
      BETTER_AUTH_URL: https://api.example.invalid
      APP_ORIGINS: https://app.example.invalid
      WORKER_DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      MIGRATION_DATABASE_URL: postgresql://postgres@localhost/infraforge_packaging
      WORKER_DATABASE_MODE: direct
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      RELEASE_IMAGE: infraforge-packaging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker compose --env-file /dev/null -f apps/backend/docker-compose.yml config --quiet
      - run: docker build --build-arg RELEASE_SHA="$RELEASE_SHA" -f apps/backend/Dockerfile -t infraforge-packaging .
      - run: |
          docker compose --env-file /dev/null -f apps/backend/docker-compose.yml config --format json > /tmp/compose.json
          for service in api worker ws-server; do
            workdir=$(jq -er --arg service "$service" '.services[$service].working_dir' /tmp/compose.json)
            entrypoint=$(jq -er --arg service "$service" '.services[$service].command[2]' /tmp/compose.json)
            docker run --rm --workdir "$workdir" infraforge-packaging bun build "$entrypoint" --target=bun --outdir=/tmp/entrypoints
          done
          docker run --rm --workdir "$workdir" infraforge-packaging bun build scripts/recover-ownership.ts --target=bun --outdir=/tmp/entrypoints
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun --no-env-file scripts/release/rehearse.ts infraforge-packaging
