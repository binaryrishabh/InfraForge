name: Deploy InfraForge

on:
  push:
    branches: [main]
    # Rebuild backend containers when their source or workspace inputs change.
    paths:
      - "Backend/**"
      - "shared/**"
      - "packages/**"
      - "Frontend/package.json"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/InfraForge
            git pull origin main
            cd Backend
            docker compose down
            docker compose up --build -d
            docker image prune -f
