name: Release InfraForge

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full approved main commit SHA
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          echo "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

  validate:
    needs: release-gate
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.release_sha }}

  deploy-backend:
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require pinned SSH host identity
        env:
          FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: test -n "$FINGERPRINT"
      - name: Release exact commit on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: RELEASE_SHA
          command_timeout: 25m
          script: |
            set -eu
            echo "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
            cd ~/InfraForge
            test -z "$(git status --porcelain)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            test "$(bun --version)" = 1.3.14
            bun --no-env-file scripts/release.ts apply "$RELEASE_SHA" /etc/infraforge/release.env /var/lib/infraforge/releases
