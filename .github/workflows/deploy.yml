name: Release InfraForge

on: # zizmor: ignore[dangerous-triggers] -- gate.cjs admits only successful exact-current-main push CI from this repository; gate code is checked out from main.
  workflow_run:
    workflows: [Validate workspaces]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA with successful push CI (retry, no second validation)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-gate:
    if: >-
      vars.PRODUCTION_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        id: gate
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const { admitRelease } = require('./scripts/deploy/gate.cjs');
            core.setOutput('sha', await admitRelease(github, context, process.env.REQUESTED_SHA));

  # The home server never builds the backend image: a GitHub runner builds the exact approved commit once,
  # publishes it, and the immutable digest (not a tag) is the only image the release may use.
  image:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-gate.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build, verify and publish the exact release image
        id: publish
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/deploy/image.ts publish "$RELEASE_SHA"

  release:
    needs: [release-gate, image]
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      deployments: read
      packages: read
    env:
      RELEASE_SHA: ${{ needs.release-gate.outputs.sha }}
      RELEASE_IMAGE: ${{ needs.image.outputs.reference }}
      BACKEND_ORIGIN: ${{ vars.PRODUCTION_BACKEND_ORIGIN }}
      FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify release prerequisites before touching the home server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_IMAGE: ${{ env.RELEASE_IMAGE }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: bun --no-env-file scripts/deploy/preflight.ts
      # This job's own fresh token (not the image job's) must be able to read the exact published digest.
      # Failing here, before Tailscale/SSH/backup, leaves production untouched.
      - name: Prove this job can pull the exact approved image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/deploy/image.ts verify "$RELEASE_SHA" "$RELEASE_IMAGE"
      - name: Recheck main after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
      - name: Install pinned frontend release client
        run: bash scripts/deploy/install-vercel.sh
      - name: Check Vercel access before touching the home server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel project inspect "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" > /dev/null
      # The home server has no public SSH; reach it over an ephemeral Tailscale node.
      # The EC2_* secrets then hold the home server's Tailscale address, user, key and host fingerprint.
      - name: Join Tailscale for the home server
        if: vars.DEPLOY_OVER_TAILSCALE == 'true'
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:infraforge-ci
          ping: ${{ secrets.EC2_HOST }}
      # The action downloads into the fresh checkout; the frontend deploy needs it clean.
      # Only untracked, non-ignored files exist here, and all of them came from that action.
      - name: Remove the Tailscale download from the checkout
        if: vars.DEPLOY_OVER_TAILSCALE == 'true'
        run: |
          git status --porcelain
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Release exact backend commit
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: RELEASE_SHA,RELEASE_IMAGE,RELEASE_REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 25m
          script: |
            set -eu
            echo "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
            echo "$RELEASE_IMAGE" | grep -Eq '^ghcr\.io/binaryrishabh/infraforge-backend@sha256:[a-f0-9]{64}$'
            # Keep the short-lived registry token out of every child environment; it reaches only the pull, over stdin.
            registry_token="$REGISTRY_TOKEN"; unset REGISTRY_TOKEN
            cd ~/InfraForge
            test -z "$(git status --porcelain)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            # A non-interactive session skips .bashrc; a user-installed Bun lives here.
            export PATH="$HOME/.bun/bin:$PATH"
            test "$(bun --version)" = 1.3.14
            # Fresh, restore-checked database backup (also uploaded to R2) before any migration.
            sudo -n /usr/local/sbin/infraforge-backup
            printf '%s' "$registry_token" | RELEASE_REGISTRY_AUTH=stdin bun --no-env-file scripts/deploy/backend.ts "$RELEASE_SHA" /etc/infraforge/release.env /var/lib/infraforge/releases
      - name: Independently verify public backend and select its exact release
        id: backend
        run: bun --no-env-file scripts/deploy/backend.ts --public "$RELEASE_SHA" "$BACKEND_ORIGIN" "$FRONTEND_ORIGIN"
      - name: Select the accepted checkout for frontend promotion
        if: steps.backend.outputs.reuse_frontend != 'true'
        env:
          ACCEPTED_SHA: ${{ steps.backend.outputs.sha }}
        run: git checkout --detach "$ACCEPTED_SHA"
      - name: Stage, verify and promote the same frontend commit
        if: steps.backend.outputs.reuse_frontend != 'true'
        env:
          RELEASE_SHA: ${{ steps.backend.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/deploy/frontend.sh
      - name: Record the verified production release
        env:
          ACCEPTED_SHA: ${{ steps.backend.outputs.sha }}
        run: printf 'Requested %s; verified backend and frontend %s.\n' "$RELEASE_SHA" "$ACCEPTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-release-receipt
          path: /tmp/infraforge-production-release.json
          if-no-files-found: ignore
          retention-days: 90
