name: Deploy InfraForge

on:
  push:
    branches: [main]
    # Rebuild backend containers when their source or workspace inputs change.
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "apps/web/package.json"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd ~/InfraForge
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            cd apps/backend
            docker compose build
            docker compose up -d
