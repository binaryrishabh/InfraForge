name: Release InfraForge

on: # zizmor: ignore[dangerous-triggers] -- gate.cjs admits only successful exact-current-main push CI from this repository; gate code is checked out from main.
  workflow_run:
    workflows: [Validate workspaces]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA with successful push CI (retry, no second validation)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-gate:
    if: >-
      vars.PRODUCTION_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        id: gate
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        with:
          script: |
            const { admitRelease } = require('./scripts/deploy/gate.cjs');
            core.setOutput('sha', await admitRelease(github, context, process.env.REQUESTED_SHA));

  release:
    needs: release-gate
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ needs.release-gate.outputs.sha }}
      BACKEND_ORIGIN: ${{ vars.PRODUCTION_BACKEND_ORIGIN }}
      FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify release prerequisites before touching EC2
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: bun --no-env-file scripts/deploy/preflight.ts
      - name: Recheck main after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
      - name: Install pinned frontend release client
        run: bash scripts/deploy/install-vercel.sh
      - name: Check Vercel access before touching EC2
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel project inspect "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" > /dev/null
      # The home server has no public SSH; reach it over an ephemeral Tailscale node.
      # The EC2_* secrets then hold the home server's Tailscale address, user, key and host fingerprint.
      - name: Join Tailscale for the home server
        if: vars.DEPLOY_OVER_TAILSCALE == 'true'
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:infraforge-ci
          ping: ${{ secrets.EC2_HOST }}
      # The action downloads tailscale.tgz into the checkout; the frontend deploy needs it clean.
      - name: Remove the Tailscale download from the checkout
        if: vars.DEPLOY_OVER_TAILSCALE == 'true'
        run: rm -f tailscale.tgz && test -z "$(git status --porcelain)"
      - name: Release exact backend commit
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: RELEASE_SHA
          command_timeout: 25m
          script: |
            set -eu
            echo "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
            cd ~/InfraForge
            test -z "$(git status --porcelain)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            # A non-interactive session skips .bashrc; a user-installed Bun lives here.
            export PATH="$HOME/.bun/bin:$PATH"
            test "$(bun --version)" = 1.3.14
            bun --no-env-file scripts/deploy/backend.ts "$RELEASE_SHA" /etc/infraforge/release.env /var/lib/infraforge/releases
      - name: Independently verify public backend
        run: bun --no-env-file scripts/release/public-check.ts "$RELEASE_SHA" "$BACKEND_ORIGIN"
      - name: Stage, verify and promote the same frontend commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/deploy/frontend.sh
      - name: Final public production verification
        run: |
          # The production alias propagates through the CDN; retry the public check for up to ~90s.
          for attempt in $(seq 1 18); do
            if bun --no-env-file scripts/release/frontend-check.ts "$RELEASE_SHA" "$FRONTEND_ORIGIN" "$BACKEND_ORIGIN"; then break; fi
            [[ $attempt -lt 18 ]] || { echo 'Public frontend did not serve the release within 90s' >&2; exit 1; }
            sleep 5
          done
          printf 'Accepted backend and frontend %s.\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-release-receipt
          path: /tmp/infraforge-production-release.json
          if-no-files-found: ignore
          retention-days: 90
