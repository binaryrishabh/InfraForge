# Budget for the owner-confirmed 2 vCPU / 4 GiB host: see ops/BACKEND_CAPACITY.md.
x-app: &app
  image: ${RELEASE_IMAGE:?Use a commit-tagged release image}
  working_dir: /app/apps/backend
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    redis:
      condition: service_healthy
  networks: [application, egress]

x-environment: &environment
  DATABASE_URL: ${DATABASE_URL:?Set the database URL}
  RELEASE_SHA: ${RELEASE_SHA:?Set the full release commit SHA}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NODE_ENV: production
  # Shared operational policy: API admission and worker enforcement must agree.
  MODEL1_OWNER_RESERVATIONS: ${MODEL1_OWNER_RESERVATIONS:-2}
  MODEL1_GLOBAL_RESERVATIONS: ${MODEL1_GLOBAL_RESERVATIONS:-4}
  MODEL1_QUEUED_RESERVATIONS: ${MODEL1_QUEUED_RESERVATIONS:-2}
  MODEL1_ACTIVE_RESERVATIONS: ${MODEL1_ACTIVE_RESERVATIONS:-2}
  MODEL1_ADMISSION_BYTES: ${MODEL1_ADMISSION_BYTES:-131072}
  MODEL1_FREEFORM_SECONDS: ${MODEL1_FREEFORM_SECONDS:-900}
  MODEL1_RUNTIME_SECONDS: ${MODEL1_RUNTIME_SECONDS:-3600}
  MODEL1_LIFETIME_SECONDS: ${MODEL1_LIFETIME_SECONDS:-1800}

x-auth: &auth
  <<: *environment
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a stable random authentication secret}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS API origin}
  APP_ORIGINS: ${APP_ORIGINS:?Set exact permitted HTTPS frontend origins}

x-health: &health
  interval: 10s
  timeout: 8s
  retries: 3
  start_period: 15s

services:
  # Started by the release controller only when a selected URL names postgres.
  # No host listener or egress network: plaintext traffic stays on this host.
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    profiles: [database]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infraforge}
      POSTGRES_DB: ${POSTGRES_DB:-infraforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [application]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 0.50
    shm_size: 128m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: [postgres, -c, shared_buffers=192MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, max_connections=80, -c, max_parallel_workers_per_gather=0, -c, max_wal_size=512MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  migration:
    <<: *app
    profiles: [release]
    mem_limit: 256m
    cpus: 0.25
    restart: "no"
    environment:
      <<: *environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set a direct migration database URL}
      API_DATABASE_URL: ${DATABASE_URL:?Set the database URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set a session-preserving worker URL}
    command: [bun, release/cli.ts, preflight]

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    volumes: [redis_data:/data]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.15
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # Queue keys must never be evicted silently. Capacity errors fail delivery
    # explicitly; leave headroom above maxmemory for AOF buffers and rewrites.
    command: [redis-server, --appendonly, "yes", --maxmemory, "96mb", --maxmemory-policy, noeviction]
    networks: [application]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *app
    mem_limit: 384m
    cpus: 0.35
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    environment:
      <<: *auth
      PORT: "3000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ACCOUNT_ESSENTIALS_ENABLED: ${ACCOUNT_ESSENTIALS_ENABLED:-false}
      TRANSACTIONAL_EMAIL_PROVIDER: ${TRANSACTIONAL_EMAIL_PROVIDER:-}
      TRANSACTIONAL_EMAIL_FROM: ${TRANSACTIONAL_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_SESSION_TOKEN: ${SES_SESSION_TOKEN:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
    command: [bun, --no-env-file, --no-install, executionIdentity/launcher.ts, api]
    healthcheck:
      <<: *health
      test: [CMD, bun, health/probe.ts, "3000"]

  worker:
    <<: *app
    mem_limit: 768m
    cpus: 0.5
    environment:
      <<: *environment
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set a session-preserving PostgreSQL worker URL}
      WORKER_DATABASE_MODE: ${WORKER_DATABASE_MODE:?Set direct or session after checking the provider}
    command: [bun, --no-env-file, --no-install, executionIdentity/launcher.ts, worker]
    healthcheck:
      <<: *health
      test: [CMD, bun, health/probe.ts, "3002"]

  ws-server:
    <<: *app
    mem_limit: 256m
    cpus: 0.25
    ports: ["127.0.0.1:${WS_PORT:-3001}:3001"]
    environment: *auth
    command: [bun, --no-env-file, --no-install, executionIdentity/launcher.ts, ws]
    healthcheck:
      <<: *health
      test: [CMD, bun, health/probe.ts, "3001"]

volumes:
  redis_data:
  postgres_data:
networks:
  application:
    internal: true
  egress:
