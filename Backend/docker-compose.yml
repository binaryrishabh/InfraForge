version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  api:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    working_dir: /app/Backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: unless-stopped
    command: bun run index.ts

  worker:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    working_dir: /app/Backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: unless-stopped
    command: bun run worker.ts

  ws-server:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    working_dir: /app/Backend
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: unless-stopped
    command: bun run ws-server.ts

volumes:
  redis_data: